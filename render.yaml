# Render Blueprint: https://render.com/docs/blueprint-spec
databases:
  - name: bulir-db
    plan: free
    databaseName: bulir
    user: bulir

services:
  - type: web
    name: bulir-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bulir-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # random 256-bit value, never stored in git
      - key: TRUST_PROXY
        value: "1" # Render puts one proxy in front of the service
      - key: CORS_ORIGIN
        sync: false # asked on first deploy: the frontend URL
